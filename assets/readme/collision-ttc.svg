<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-label="Animated near-miss: a car reverses out of a bay while another drives down the aisle; predicted paths overlap, time-to-collision drops and a near-miss alert fires before the driver brakes">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .lbl { fill: #8b949e; font-size: 11px; }
    .v { font-size: 22px; font-weight: 700; }
  </style>
  <rect width="880" height="270" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="269" rx="16" fill="none" stroke="#30363d"/>
  <text x="24" y="26" fill="#e6edf3" font-size="13" font-weight="700">Near-miss detection · swept boxes + time-to-collision</text>

  <!-- lot -->
  <rect x="20" y="40" width="600" height="210" rx="6" fill="#161b22"/>
  <g fill="none" stroke="#484f58" stroke-width="2">
    <rect x="260" y="42" width="66" height="76"/><rect x="330" y="42" width="66" height="76"/>
    <rect x="400" y="42" width="66" height="76"/><rect x="470" y="42" width="66" height="76"/>
    <rect x="540" y="42" width="66" height="76"/>
  </g>
  <line x1="20" y1="185" x2="620" y2="185" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.4"/>

  <!-- Car A: reverses out of bay -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
      values="433 78;433 78;433 128;433 131;433 131" keyTimes="0;0.1;0.5;0.58;1"/>
    <rect x="-28" y="20" width="56" height="58" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.5;0.56" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-15" y="-25" width="30" height="50" rx="7" fill="#d2a8ff"/>
    <rect x="-12" y="-16" width="24" height="12" rx="3" fill="#0d1117" opacity="0.7"/>
    <rect x="-12" y="10" width="24" height="8" rx="3" fill="#0d1117" opacity="0.7"/>
    <text x="0" y="-31" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">A · reversing</text>
  </g>

  <!-- Car B: drives down the aisle, brakes -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
      values="40 160;310 160;360 160;364 160;364 160" keyTimes="0;0.45;0.6;0.66;1"/>
    <rect x="26" y="-17" width="86" height="34" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5 4" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.55;0.62" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-25" y="-15" width="50" height="30" rx="8" fill="#58a6ff"/>
    <rect x="3" y="-12" width="12" height="24" rx="3" fill="#0d1117" opacity="0.7"/>
    <rect x="-19" y="-12" width="8" height="24" rx="3" fill="#0d1117" opacity="0.7"/>
    <text x="0" y="32" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">B</text>
  </g>

  <!-- conflict point pulse -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.8" calcMode="discrete" dur="7s" repeatCount="indefinite"/>
    <circle cx="420" cy="160" r="10" fill="none" stroke="#f85149" stroke-width="3">
      <animate attributeName="r" values="8;42" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="160" r="4" fill="#f85149"/>
  </g>

  <!-- readout -->
  <g transform="translate(636 40)">
    <rect width="224" height="210" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" class="lbl">TIME TO COLLISION</text>
    <text x="14" y="54" class="v" fill="#3fb950">∞<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.15;0.6" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
    <text x="14" y="54" class="v" fill="#e3b341" opacity="0">2.4 s<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.15;0.3" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
    <text x="14" y="54" class="v" fill="#f0883e" opacity="0">1.1 s<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.42" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
    <text x="14" y="54" class="v" fill="#f85149" opacity="0">0.6 s<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.42;0.6" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>

    <text x="14" y="86" class="lbl">p(NEAR_MISS ∨ COLLISION) · LightGBM</text>
    <rect x="14" y="96" width="196" height="10" rx="5" fill="#30363d"/>
    <rect x="14" y="96" width="10" height="10" rx="5" fill="#f85149">
      <animate attributeName="width" values="10;10;150;170;20;10" keyTimes="0;0.15;0.42;0.55;0.8;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <line x1="112" y1="92" x2="112" y2="110" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="116" y="122" class="lbl">0.5 alert</text>

    <text x="14" y="150" class="lbl">STATE (3-frame hysteresis)</text>
    <text x="14" y="182" class="v" fill="#3fb950">NORMAL<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.36;0.82" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
    <text x="14" y="182" class="v" fill="#f85149" opacity="0">⚠ NEAR-MISS<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.36;0.82" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
  </g>
</svg>
